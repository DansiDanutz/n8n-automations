name: Verify privileged service contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/verify_security_contracts.py
      - run: python3 -m compileall -q cron-job-dashboard api-rate-limiter purchase-webhook webhook-relay-logger/backend scripts
      - run: bash -n cron-job-dashboard/setup.sh
      - run: bash -n api-rate-limiter/setup.sh
