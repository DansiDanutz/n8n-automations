name: Verify privileged service contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/verify_security_contracts.py
      - run: python3 -m unittest discover -s api-rate-limiter/tests
      - run: python3 -m compileall -q cron-job-dashboard api-rate-limiter purchase-webhook webhook-relay-logger/backend ai-email-assistant/backend appointment-booking-system social-media-auto-poster invoice-generator-api ai-document-summarizer ai-customer-support-bot scripts
      - run: bash -n cron-job-dashboard/setup.sh
      - run: bash -n api-rate-limiter/setup.sh
      - run: bash -n ai-email-assistant/setup.sh ai-email-assistant/start.sh
      - run: bash -n appointment-booking-system/setup.sh
      - run: bash -n social-media-auto-poster/setup.sh
      - run: bash -n invoice-generator-api/setup.sh
      - run: bash -n ai-document-summarizer/setup.sh
      - run: bash -n ai-customer-support-bot/setup.sh
